# Publishes a new release automatically on every push to master (docs-only changes excluded).
# The version is derived from the commit messages since the last release (see scripts/next-version.js).
# The installed app checks these releases on startup and offers to update.
name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Work out the next version
        id: version
        run: |
          version=$(node scripts/next-version.js)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then echo "No new commits since the last release."; else echo "Releasing $version"; fi

      - name: Create draft release with generated notes
        if: steps.version.outputs.version != ''
        run: |
          tag="v${{ steps.version.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" --draft --generate-notes --target "$GITHUB_SHA" --title "Aurora Player ${{ steps.version.outputs.version }}"

      - name: Install dependencies
        if: steps.version.outputs.version != ''
        run: |
          npm ci
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Build the installer and upload it to the draft
        if: steps.version.outputs.version != ''
        run: npm run release

      - name: Publish the release
        if: steps.version.outputs.version != ''
        run: gh release edit "v${{ steps.version.outputs.version }}" --draft=false --latest
