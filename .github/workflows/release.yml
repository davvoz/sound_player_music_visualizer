# Builds the Windows installer and publishes a GitHub release when a version tag (e.g. v1.2.0) is pushed.
# The installed app checks these releases on startup and offers to update.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Create draft release with generated notes
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "Aurora Player ${GITHUB_REF_NAME#v}"

      - run: npm ci

      - name: Build the installer and upload it to the draft
        run: npm run release

      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
